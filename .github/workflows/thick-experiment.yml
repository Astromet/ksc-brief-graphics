name: Thickness overlay experiment
on:
  workflow_dispatch:
    inputs:
      args: {description: "cycle fhour yyyymmdd", required: true}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests pillow numpy scipy matplotlib pygrib
      - run: mkdir -p out && python tools/thick_experiment.py ${{ github.event.inputs.args }}
      - name: Push results to the exp-out branch
        if: always()
        run: |
          cd out && rm -f hgt.grb2 && git init -q && git checkout -q -b exp-out && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" exp-out
