name: Update briefing graphics

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      products:
        description: "Only build these products (space-separated); blank = all"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  # 6:35-7:50 AM Eastern the morning watch (sounding-watch.yml) runs the builds: its full
  # refreshes and a quick sounding rebuild the minute SMG posts the 12Z sounding (never
  # before ~7:10). A 15-minute scheduled build then would hold that rebuild up, so skip it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.t.outputs.run }}
    steps:
      - id: t
        env:
          TZ: America/New_York
        run: |
          hm=$(date +%H%M)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hm" -ge 0635 ] && [ "$hm" -le 0750 ]; then
            echo "scheduled run during the morning sounding window ($hm ET): skipped"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: graphics
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation >/dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null

      - name: Start from the last published images
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev
            cp -r prev/. site/ && rm -rf site/.git prev
          fi

      - name: Build graphics
        run: python build.py site ${{ github.event.inputs.products }}

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Update graphics"

      # GitHub pauses scheduled jobs after 60 days without repo activity; this keeps it running.
      - uses: liskin/gh-workflow-keepalive@v1
