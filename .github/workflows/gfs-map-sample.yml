name: GFS map sample
on:
  workflow_dispatch:
    inputs:
      init: {description: "YYYYMMDDHH", required: true}
      fhours: {description: "comma list", required: true}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: mkdir -p out && python tools/gfs_map_sample.py ${{ github.event.inputs.init }} ${{ github.event.inputs.fhours }}
      - name: Push results to the exp-out branch
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b exp-out && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" exp-out
