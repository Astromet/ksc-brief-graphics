name: Morning brief watch (sounding, NHC outlook, full refreshes)

# The brief is used in the morning. From 6:40 to 8:05 AM Eastern this job:
#  - runs a full refresh of every product at 6:45, 7:15 and 7:40 AM Eastern;
#  - polls the KXMR sounding plot (posted, often more than once, ~7:05-7:50) and the
#    NHC 7-day outlook map every minute, rebuilding the sounding, NHC map and deck as
#    soon as either changes (unless a rebuild is already queued, which will pick it up).
# Two start times cover EST/EDT and GitHub's schedule delays; a later start replaces an
# earlier one.
on:
  schedule:
    - cron: "23 10 * * *"
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sounding-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Watch from 6:40 to 8:05 AM Eastern
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TZ: America/New_York
          URL: https://www.weather.gov/images/smg/KSCSNDG.GIF
          NHC: https://www.nhc.noaa.gov/xgtwo/two_atl_7d0.png
          UA: "KSC-brief-graphics (github.com/Astromet/ksc-brief-graphics)"
        run: |
          start=$(date -d "today 06:40" +%s); end=$(date -d "today 08:05" +%s)
          now=$(date +%s)
          if [ "$now" -ge "$end" ]; then echo "past the 8:05 AM window"; exit 0; fi
          if [ "$now" -lt "$start" ]; then echo "waiting until 6:40 AM Eastern"; sleep $(( start - now )); fi
          dispatch() {  # $1 = products ("" = everything)
            gh api -X POST "repos/$GH_REPO/actions/workflows/update.yml/dispatches" -f ref=main -f "inputs[products]=$1" >/dev/null
          }
          queued() {    # is an update run already waiting to start?
            gh api "repos/$GH_REPO/actions/workflows/update.yml/runs?per_page=10" \
              -q '[.workflow_runs[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length' 2>/dev/null || echo 0
          }
          # full refreshes; any already more than 5 minutes past (an earlier watch did them) are skipped
          refresh=()
          for t in 06:45 07:15 07:40; do
            ts=$(date -d "today $t" +%s)
            if [ $(( $(date +%s) - ts )) -lt 300 ]; then refresh+=("$ts"); fi
          done
          last=$(curl -fsS "https://astromet.github.io/ksc-brief-graphics/ksc_sounding.json?t=$(date +%s)" | jq -r '.source_modified // empty' || true)
          nlast=$(curl -fsS "https://astromet.github.io/ksc-brief-graphics/nhc_meta.json?t=$(date +%s)" | jq -r '.source_modified // empty' || true)
          echo "published sounding: ${last:-unknown}; published NHC outlook: ${nlast:-unknown}"
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s); keep=()
            for ts in "${refresh[@]}"; do
              if [ "$now" -ge "$ts" ]; then
                echo "$(date +%H:%M) scheduled full refresh"; dispatch ""
              else keep+=("$ts"); fi
            done
            refresh=("${keep[@]}")
            lm=$(curl -fsSI -A "$UA" "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{print $2}' || true)
            nm=$(curl -fsSI -A "$UA" "$NHC" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{print $2}' || true)
            new=""
            if [ -n "$lm" ] && [ "$lm" != "$last" ]; then new="sounding ($lm)"; last="$lm"; fi
            if [ -n "$nm" ] && [ "$nm" != "$nlast" ]; then new="$new NHC outlook ($nm)"; nlast="$nm"; fi
            if [ -n "$new" ]; then
              # a queued run (full refresh or an earlier rebuild) will fetch the new data when it
              # starts; dispatching another would replace (cancel) that queued run
              if [ "$(queued)" -gt 0 ]; then
                echo "$(date +%H:%M) new $new; a queued rebuild will pick it up"
              else
                echo "$(date +%H:%M) new $new, rebuilding"; dispatch "ksc_sounding nhc_7day deck"
              fi
            fi
            sleep 60
          done
